<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Digital Product Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        .store-title { text-align: center; color: #333; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.2em; margin: 15px 0; }
        .btn { background: #3498db; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>

    <h1 class="store-title">Welcome to My Digital Download Store</h1>

    <div class="grid">
        {% for product in products %}
        <div class="card">
            <h3>{{ product.title }}</h3>
            <p>{{ product.description }}</p>
            <p class="price">{{ product.price }} ETB</p>
            <a href="{% url 'buy_product' product.id %}" class="btn">Buy Now</a>
        </div>
        {% empty %}
        <p style="text-align: center; width: 100%;">No digital products uploaded yet! Log into /admin to add your first product.</p>
        {% endfor %}
    </div>

</body>
</html>
